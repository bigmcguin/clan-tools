<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f14" id="themeColorMeta">
<title>Tournament Ideas</title>
<meta name="description" content="Submit and browse clan tournament ideas." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="TB Clan Tools" />
<meta property="og:title" content="TB Clan — Tournament Ideas" />
<meta property="og:description" content="Submit and browse clan tournament ideas." />
<meta property="og:url" content="https://clan.stridlabs.com/tournament-ideas.html" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="TB Clan — Tournament Ideas" />
<meta name="twitter:description" content="Submit and browse clan tournament ideas." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script>
  (function() {
    try {
      const t = localStorage.getItem('tb-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch(e) {}
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f14;
    --card: #16161f;
    --border: #2a2a38;
    --border-hi: #33335a;
    --accent: #5050cc;
    --accent-hi: #6868e6;
    --accent-deep: #2a2a60;
    --accent-soft: #12122a;
    --text: #e0e0ff;
    --text-mid: #8080b0;
    --text-dim: #555570;
    --text-faint: #44446a;
    --input-bg: #0c0c12;
    --row-bg: #0e0e18;
    --good: #50ee90;
    --good-border: #30cc70;
    --good-bg: #0c1a12;
    --err: #ff6a7a;
    --err-bg: #2a0c12;
    --shadow: 0 32px 80px rgba(0,0,0,0.5);
    --color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f1f1f6;
    --card: #ffffff;
    --border: #dadae3;
    --border-hi: #bcbccc;
    --accent: #4a4ab8;
    --accent-hi: #5a5ad0;
    --accent-deep: #c8c8e8;
    --accent-soft: #ececf8;
    --text: #1a1a2e;
    --text-mid: #4a4a6a;
    --text-dim: #6a6a8a;
    --text-faint: #9a9ab0;
    --input-bg: #f7f7fa;
    --row-bg: #fafafd;
    --good: #1c8a4a;
    --good-border: #3aa46a;
    --good-bg: #e8f5ec;
    --err: #b6243a;
    --err-bg: #fbe7ea;
    --shadow: 0 12px 32px rgba(60,60,90,0.08);
    --color-scheme: light;
  }

  html, body { background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.2s; }
  body {
    display: flex; align-items: flex-start; justify-content: center;
    font-family: 'DM Mono', 'Courier New', monospace;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 620px;
    box-shadow: var(--shadow);
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }

  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 22px; }
  .header-titles { flex: 1; min-width: 0; }
  .title {
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 800;
    color: var(--text); letter-spacing: -0.5px; margin-bottom: 4px;
  }
  :root[data-theme="light"] .title { color: #0a0a18; }
  .subtitle {
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 1.5px; text-transform: uppercase;
  }
  .theme-toggle {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
    background: transparent; border: 1px solid var(--border);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1; padding: 0; transition: all 0.18s;
    color: var(--text-mid);
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent-hi); transform: rotate(15deg); }
  .theme-toggle:active { transform: rotate(15deg) scale(0.94); }
  .theme-toggle .icon-light { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-dark { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-light { display: inline; }

  .sync-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    padding: 4px 9px; border-radius: 99px;
    border: 1px solid var(--border); color: var(--text-dim);
    background: var(--input-bg);
    margin-bottom: 18px;
  }
  .sync-pill .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint);
  }
  .sync-pill.state-loading .dot { background: #d0a040; animation: pulse 1.2s infinite; }
  .sync-pill.state-live .dot { background: var(--good); }
  .sync-pill.state-error .dot { background: var(--err); }
  .sync-pill.state-setup .dot { background: #d0a040; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .section-label {
    font-size: 10px; color: var(--text-faint);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 8px;
  }

  form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 10px; color: var(--text-faint);
    letter-spacing: 1.5px; text-transform: uppercase;
    font-weight: 700;
  }
  input[type="text"], textarea {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    width: 100%;
    color-scheme: var(--color-scheme);
  }
  textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--text-faint); }

  .submit-btn {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .submit-btn:hover:not(:disabled) { background: var(--accent-deep); border-color: var(--accent-hi); color: var(--accent-hi); }
  .submit-btn:active:not(:disabled) { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .form-status {
    font-size: 12px; padding: 10px 14px; border-radius: 8px;
    border: 1px solid transparent;
    display: none;
  }
  .form-status.show { display: block; animation: fadeUp 0.25s ease; }
  .form-status.ok { color: var(--good); background: var(--good-bg); border-color: var(--good-border); }
  .form-status.err { color: var(--err); background: var(--err-bg); border-color: var(--err); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .ideas-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-top: 8px; margin-bottom: 10px;
  }
  .ideas-header .count {
    font-size: 10px; color: var(--text-faint); letter-spacing: 1px;
  }

  .ideas-list { display: flex; flex-direction: column; gap: 10px; }
  .idea {
    background: var(--row-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    transition: border-color 0.15s;
  }
  .idea:hover { border-color: var(--border-hi); }
  .idea-meta {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 8px;
  }
  .idea-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 13px;
    color: var(--accent-hi); letter-spacing: 0.3px;
  }
  :root[data-theme="light"] .idea-name { color: var(--accent); }
  .idea-time {
    font-size: 10px; color: var(--text-faint); letter-spacing: 0.5px;
  }
  .idea-body {
    font-size: 13px; color: var(--text); line-height: 1.55;
    white-space: pre-wrap; word-wrap: break-word;
  }

  .empty {
    text-align: center; padding: 28px 14px;
    color: var(--text-dim);
    font-size: 12px; letter-spacing: 0.5px;
    border: 1px dashed var(--border-hi);
    border-radius: 10px;
  }

  .nav-footer {
    text-align: center; padding-top: 16px; margin-top: 22px;
    border-top: 1px solid var(--border);
    font-size: 9.5px; color: var(--text-faint); letter-spacing: 1.5px;
    display: flex; justify-content: center; flex-wrap: wrap; gap: 16px;
  }
  .nav-footer a { color: var(--text-dim); text-decoration: none; text-transform: uppercase; transition: color 0.15s; }
  .nav-footer a:hover { color: var(--accent-hi); }
  .nav-footer .here { color: var(--accent-hi); text-transform: uppercase; text-decoration: underline; text-underline-offset: 3px; }
  .nav-top { border-top: none; border-bottom: 1px solid var(--border); margin: 0 0 22px; padding: 0 0 14px; flex-wrap: wrap; }
  :root[data-theme="light"] .nav-footer a { color: var(--text-dim); }
  :root[data-theme="light"] .nav-footer a:hover { color: var(--accent); }
  :root[data-theme="light"] .nav-footer .here { color: var(--accent); }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .card { padding: 22px 16px; }
    .title { font-size: 20px; }
  }
</style>
</head>
<body>
  <div class="card">
    <nav class="nav-footer nav-top">
      <a href="index.html">Time Converter</a>
      <a href="members.html">Members</a>
      <a href="loadouts.html">Loadouts</a>
      <a href="callouts.html">Callouts</a>
      <span class="here">Tournament Ideas</span>
    </nav>
    <header class="header">
      <div class="header-titles">
        <h1 class="title">Tournament Ideas</h1>
        <div class="subtitle">Pitch your next clan event</div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle theme">
        <span class="icon-dark">☾</span><span class="icon-light">☀</span>
      </button>
    </header>

    <span class="sync-pill state-loading" id="syncPill"><span class="dot"></span>Connecting</span>

    <form id="ideaForm" autocomplete="off">
      <div class="field">
        <label for="fName">Your name</label>
        <input type="text" id="fName" name="name" maxlength="60" required placeholder="e.g. Mcguin">
      </div>
      <div class="field">
        <label for="fIdea">Tournament idea</label>
        <textarea id="fIdea" name="idea" maxlength="1500" required placeholder="What's the format? Squad size, weapon restrictions, map pool, prize ideas..."></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Submit Idea</button>
      <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
    </form>

    <div class="ideas-header">
      <div class="section-label" style="margin-bottom:0;">Submitted Ideas</div>
      <div class="count" id="ideaCount"></div>
    </div>
    <div class="ideas-list" id="ideasList">
      <div class="empty">Loading ideas…</div>
    </div>

    <nav class="nav-footer">
      <a href="index.html">Time Converter</a>
      <a href="members.html">Members</a>
      <a href="loadouts.html">Loadouts</a>
      <a href="callouts.html">Callouts</a>
      <span class="here">Tournament Ideas</span>
    </nav>
  </div>

<script type="module">
'use strict';

const firebaseConfig = {
  apiKey:            "AIzaSyBkVBbffcv-K9tpJ8yXSs6tRRtx5tBoFIk",
  authDomain:        "tbloadout.firebaseapp.com",
  projectId:         "tbloadout",
  storageBucket:     "tbloadout.firebasestorage.app",
  messagingSenderId: "737521874020",
  appId:             "1:737521874020:web:fba10503b2008ccf719b71",
};

import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {
  getFirestore, collection, addDoc,
  onSnapshot, query, orderBy, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

const COLLECTION = 'tournament-ideas';

let db = null;
let IDEAS = [];

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function setSyncState(stateName, label) {
  const pill = document.getElementById('syncPill');
  pill.className = `sync-pill state-${stateName}`;
  pill.innerHTML = `<span class="dot"></span>${label}`;
}

function showStatus(kind, message) {
  const el = document.getElementById('formStatus');
  el.className = `form-status show ${kind}`;
  el.textContent = message;
  if (kind === 'ok') {
    setTimeout(() => { el.className = 'form-status'; el.textContent = ''; }, 4000);
  }
}

function formatTimestamp(ts) {
  if (!ts) return 'just now';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.round(diffMs / 60000);
  if (diffMin < 1) return 'just now';
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHr = Math.round(diffMin / 60);
  if (diffHr < 24) return `${diffHr}h ago`;
  const diffDay = Math.round(diffHr / 24);
  if (diffDay < 7) return `${diffDay}d ago`;
  return d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: '2-digit' });
}

function renderIdeas() {
  const list = document.getElementById('ideasList');
  const count = document.getElementById('ideaCount');
  count.textContent = IDEAS.length ? `${IDEAS.length} total` : '';
  if (!IDEAS.length) {
    list.innerHTML = `<div class="empty">No ideas yet — be the first to pitch one.</div>`;
    return;
  }
  list.innerHTML = IDEAS.map(i => `
    <div class="idea">
      <div class="idea-meta">
        <span class="idea-name">${escapeHtml(i.name || 'Anonymous')}</span>
        <span class="idea-time">${escapeHtml(formatTimestamp(i.createdAt))}</span>
      </div>
      <div class="idea-body">${escapeHtml(i.idea || '')}</div>
    </div>
  `).join('');
}

function subscribeIdeas() {
  const q = query(collection(db, COLLECTION), orderBy('createdAt', 'desc'));
  onSnapshot(q, (snap) => {
    IDEAS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    setSyncState('live', `Live · ${IDEAS.length}`);
    renderIdeas();
  }, (err) => {
    console.error('Snapshot error:', err);
    const code = err && err.code ? err.code : 'unknown';
    setSyncState('error', 'Lost: ' + code);
    document.getElementById('ideasList').innerHTML =
      `<div class="empty">Firestore error [${escapeHtml(code)}]: ${escapeHtml(err && err.message ? err.message : 'unknown')}</div>`;
  });
}

async function submitIdea(name, idea) {
  if (!db) throw new Error('Database not initialised');
  await addDoc(collection(db, COLLECTION), {
    name,
    idea,
    createdAt: serverTimestamp(),
  });
}

function initFirebase() {
  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    setSyncState('loading', 'Connecting');
    subscribeIdeas();
  } catch (e) {
    console.error('Firebase init failed:', e);
    setSyncState('error', 'Connection failed');
    document.getElementById('ideasList').innerHTML =
      `<div class="empty">Couldn't connect to the database.</div>`;
  }
}

function bindForm() {
  const form = document.getElementById('ideaForm');
  const submitBtn = document.getElementById('submitBtn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('fName').value.trim();
    const idea = document.getElementById('fIdea').value.trim();
    if (!name || !idea) {
      showStatus('err', 'Please fill in both your name and the idea.');
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    try {
      await submitIdea(name, idea);
      document.getElementById('fIdea').value = '';
      showStatus('ok', '✓ Idea submitted — thanks!');
    } catch (err) {
      console.error('Submit failed:', err);
      showStatus('err', `Couldn't submit: ${err.message || 'unknown error'}`);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Idea';
    }
  });
}

function setTheme(t) {
  if (t === 'light') document.documentElement.dataset.theme = 'light';
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('tb-theme', t); } catch(e) {}
  const meta = document.getElementById('themeColorMeta');
  if (meta) meta.setAttribute('content', t === 'light' ? '#f1f1f6' : '#0f0f14');
}
function currentTheme() {
  return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
}

document.getElementById('themeToggle').addEventListener('click', () => {
  setTheme(currentTheme() === 'light' ? 'dark' : 'light');
});
setTheme(currentTheme());

bindForm();
initFirebase();
</script>
</body>
</html>
