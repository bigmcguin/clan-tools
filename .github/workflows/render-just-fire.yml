name: Render Just Fire films

# Trigger manually — from the GitHub mobile app or website:
#   Actions tab → "Render Just Fire films" → Run workflow
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which film to render"
        type: choice
        default: "all"
        options: ["all", "1", "2", "3", "4", "5"]

# Needed to publish the rendered videos as a GitHub Release.
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # System libraries Remotion's headless Chrome needs on Ubuntu.
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libxrandr2 \
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Install dependencies
        run: npm ci

      - name: Render
        run: |
          if [ "${{ inputs.target }}" = "all" ]; then
            npm run render:all
          else
            npm run "render:${{ inputs.target }}"
          fi

      - name: Upload rendered videos (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: just-fire-videos
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 30

      # Publish each MP4 as a GitHub Release asset. Release assets have direct
      # download links that work properly in mobile browsers (no zip, no
      # desktop-mode needed) — unlike Actions artifacts.
      - name: Publish videos to a GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="videos-run-${{ github.run_number }}"
          gh release create "$TAG" out/*.mp4 \
            --title "Just Fire videos — run ${{ github.run_number }}" \
            --notes "Five stitched Just Fire films (1920x1080, silent — add VO/text/T&Cs separately). Tap a file below to download straight to your phone."
          {
            echo "## ✅ Videos published as a Release"
            echo ""
            echo "Open this link on your phone and tap each .mp4 to download:"
            echo ""
            gh release view "$TAG" --json url -q .url
          } >> "$GITHUB_STEP_SUMMARY"
