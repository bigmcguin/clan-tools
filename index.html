<script>
  // Apply theme as early as possible to prevent FOUC
  (function() {
    try {
      const t = localStorage.getItem('tb-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch(e) {}

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f14;
    --card: #16161f;
    --border: #2a2a38;
    --border-hi: #33335a;
    --accent: #5050cc;
    --accent-hi: #6868e6;
    --accent-deep: #2a2a60;
    --accent-soft: #12122a;
    --text: #e0e0ff;
    --text-mid: #8080b0;
    --text-dim: #555570;
    --text-faint: #44446a;
    --input-bg: #0c0c12;
    --row-bg: #0e0e18;
    --row-bg-source: #12122a;
    --good: #50ee90;
    --good-border: #30cc70;
    --good-bg: #0c1a12;
    --day-warn-bg: #4a3010;
    --day-warn-text: #ffa050;
    --day-cool-bg: #103a4a;
    --day-cool-text: #50c0ff;
    --shadow: 0 32px 80px rgba(0,0,0,0.5);
    --color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f1f1f6;
    --card: #ffffff;
    --border: #dadae3;
    --border-hi: #bcbccc;
    --accent: #4a4ab8;
    --accent-hi: #5a5ad0;
    --accent-deep: #c8c8e8;
    --accent-soft: #ececf8;
    --text: #1a1a2e;
    --text-mid: #4a4a6a;
    --text-dim: #6a6a8a;
    --text-faint: #9a9ab0;
    --input-bg: #f7f7fa;
    --row-bg: #fafafd;
    --row-bg-source: #ececf8;
    --good: #1c8a4a;
    --good-border: #3aa46a;
    --good-bg: #e8f5ec;
    --day-warn-bg: #fff0d8;
    --day-warn-text: #c87320;
    --day-cool-bg: #d8ecf8;
    --day-cool-text: #2078b0;
    --shadow: 0 12px 32px rgba(60,60,90,0.08);
    --color-scheme: light;
  }

  html, body { background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.2s; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', 'Courier New', monospace;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 540px;
    box-shadow: var(--shadow);
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }

  /* Header with theme toggle */
  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 22px; }
  .header-titles { flex: 1; min-width: 0; }
  .title {
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 800;
    color: var(--text); letter-spacing: -0.5px; margin-bottom: 4px;
  }
  :root[data-theme="light"] .title { color: #0a0a18; }
  .subtitle {
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 1.5px; text-transform: uppercase;
  }
  .theme-toggle {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
    background: transparent; border: 1px solid var(--border);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1; padding: 0; transition: all 0.18s;
    color: var(--text-mid);
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent-hi); transform: rotate(15deg); }
  .theme-toggle:active { transform: rotate(15deg) scale(0.94); }
  .theme-toggle .icon-light { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-dark { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-light { display: inline; }

  .section-label {
    font-size: 10px; color: var(--text-faint);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .source-selector {
    display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px;
  }
  .source-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.5px;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .source-btn:hover { border-color: var(--accent); color: var(--text-mid); }
  .source-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--text);
  }
  .source-btn .btn-flag { font-size: 14px; }

  /* Date + time inputs: cleaner, symmetric, no in-input badge */
  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    align-items: stretch;
    margin-bottom: 22px;
  }
  .input-wrap { position: relative; min-width: 0; }
  input[type="date"], input[type="time"] {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    color-scheme: var(--color-scheme);
    width: 100%;
    text-align: center;
  }
  input[type="date"] { font-size: 14px; padding: 13px 10px; }
  input[type="time"] { font-size: 16px; padding: 13px 10px; }
  input[type="date"]:focus, input[type="time"]:focus { border-color: var(--accent); }
  /* On iOS the time field defaults right-aligned — keep it nudged toward centre */
  input[type="time"]::-webkit-date-and-time-value { text-align: center; }

  .now-btn {
    background: transparent;
    border: 1px dashed var(--border-hi);
    border-radius: 10px;
    padding: 0 14px;
    color: var(--text-dim);
    font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 11px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .now-btn:hover { border-color: var(--accent); color: var(--accent-hi); }
  .now-btn:active { transform: scale(0.97); }

  .results {
    display: flex; flex-direction: column; gap: 8px;
    margin-bottom: 20px; animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .result-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--row-bg);
    transition: border-color 0.2s, background 0.2s;
  }
  .result-row.source-row {
    border-color: var(--accent);
    background: var(--row-bg-source);
  }
  .row-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .flag { font-size: 18px; flex-shrink: 0; }
  .region-name { font-size: 12px; color: var(--text-mid); letter-spacing: 0.5px; }
  .source-row .region-name { color: var(--text); }
  .source-tag {
    font-size: 9px;
    background: var(--accent-deep);
    color: var(--accent-hi);
    border-radius: 4px;
    padding: 2px 5px;
    letter-spacing: 0.5px;
    margin-left: 6px;
  }
  :root[data-theme="light"] .source-tag { color: #4a4ab8; }
  .day-badge {
    font-size: 9px;
    background: var(--day-warn-bg);
    color: var(--day-warn-text);
    border-radius: 4px; padding: 2px 5px; letter-spacing: 0.5px; margin-left: 6px;
  }
  .day-badge.minus { background: var(--day-cool-bg); color: var(--day-cool-text); }
  .row-right { text-align: right; flex-shrink: 0; }
  .time-display {
    font-family: 'DM Mono', monospace;
    font-size: 17px; font-weight: 500;
    color: var(--text); letter-spacing: -0.5px;
  }
  .source-row .time-display { color: var(--accent-hi); }
  .tz-abbr { font-size: 10px; color: var(--text-faint); letter-spacing: 1px; margin-left: 4px; }

  .copy-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .copy-tab {
    flex: 1; background: transparent;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 6px; color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer;
    transition: all 0.15s;
  }
  .copy-tab:hover { color: var(--accent-hi); }
  .copy-tab.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--text);
  }

  .copy-btn {
    width: 100%; background: var(--input-bg);
    border: 1px dashed var(--border-hi);
    border-radius: 10px; padding: 13px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 12px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s;
    text-transform: uppercase;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent-hi); background: var(--accent-soft); }
  .copy-btn.copied {
    border-color: var(--good-border);
    color: var(--good);
    background: var(--good-bg);
    border-style: solid;
  }

  .preview-label {
    font-size: 10px; color: var(--text-faint);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-top: 18px; margin-bottom: 6px;
  }
  .preview-box {
    background: #36393f;
    border-radius: 8px; padding: 14px 16px;
    font-size: 13px; color: #dcddde; line-height: 1.7;
    white-space: pre-wrap; word-wrap: break-word;
    font-family: 'Whitney', 'Helvetica Neue', sans-serif;
    border-left: 3px solid #5865f2;
  }
  /* Discord preview stays Discord-coloured in both themes — that's how Discord looks */
  .preview-hint {
    font-size: 10px; color: var(--text-faint);
    letter-spacing: 0.5px; margin-top: 8px;
    font-style: italic; line-height: 1.5;
  }

  .nav-footer {
    text-align: center; padding-top: 16px; margin-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 9.5px; color: var(--text-faint); letter-spacing: 1.5px;
    display: flex; justify-content: center; gap: 16px;
  }
  .nav-footer a { color: var(--text-dim); text-decoration: none; text-transform: uppercase; transition: color 0.15s; }
  .nav-footer a:hover { color: var(--accent-hi); }
  .nav-footer .here { color: var(--accent-hi); text-transform: uppercase; text-decoration: underline; text-underline-offset: 3px; }
  .nav-top { border-top: none; border-bottom: 1px solid var(--border); margin: 0 0 22px; padding: 0 0 14px; flex-wrap: wrap; }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .card { padding: 22px 16px; }
    .input-row { grid-template-columns: 1fr 1fr; gap: 8px; }
    .now-btn { grid-column: 1 / -1; padding: 11px; font-size: 11px; }
    input[type="date"], input[type="time"] { font-size: 14px; padding: 12px 6px; }
    .title { font-size: 20px; }
    .source-btn { padding: 7px 10px; font-size: 11px; }
    .header { margin-bottom: 18px; }
  }
  @media (max-width: 360px) {
    input[type="date"] { font-size: 12.5px; }
    input[type="time"] { font-size: 14px; }
  }
</style>

<script>
const TIMEZONES = [
  { id: "nz",  label: "New Zealand",       tz: "Pacific/Auckland",   flag: "🇳🇿", abbr: "NZ"  },
  { id: "nsw", label: "New South Wales",   tz: "Australia/Sydney",   flag: "🦘",  abbr: "NSW" },
  { id: "qld", label: "Queensland",        tz: "Australia/Brisbane", flag: "☀️",  abbr: "QLD" },
  { id: "sa",  label: "South Australia",   tz: "Australia/Adelaide", flag: "🍷",  abbr: "SA"  },
  { id: "wa",  label: "Western Australia", tz: "Australia/Perth",    flag: "⛏️",  abbr: "WA"  },
];

const state = { date: '', time: '20:00', sourceId: 'nz', copyMode: 'visual' };

function buildUtcFromTzInput(dateStr, timeStr, tz) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [h, mi] = timeStr.split(':').map(Number);
  const candidate = Date.UTC(y, m - 1, d, h, mi);
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: tz,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false,
  });
  const parts = {};
  fmt.formatToParts(new Date(candidate)).forEach(p => parts[p.type] = p.value);
  const hr = parts.hour === '24' ? 0 : parseInt(parts.hour);
  const wallAsUtc = Date.UTC(
    parseInt(parts.year), parseInt(parts.month) - 1, parseInt(parts.day),
    hr, parseInt(parts.minute), parseInt(parts.second)
  );
  const offset = candidate - wallAsUtc;
  return new Date(candidate + offset);
}

function formatInTz(utcDate, tz) {
  const fmt = new Intl.DateTimeFormat('en-AU', {
    timeZone: tz,
    hour: '2-digit', minute: '2-digit', hour12: true,
    weekday: 'short',
    year: 'numeric', month: '2-digit', day: '2-digit',
  });
  const parts = {};
  fmt.formatToParts(utcDate).forEach(p => parts[p.type] = p.value);
  const ampm = (parts.dayPeriod || '').toUpperCase();
  return {
    time: `${parts.hour}:${parts.minute} ${ampm}`.trim(),
    weekday: parts.weekday,
    dateStr: `${parts.year}-${parts.month}-${parts.day}`,
  };
}

function getTzAbbr(utcDate, tz) {
  const fmt = new Intl.DateTimeFormat('en-AU', { timeZone: tz, timeZoneName: 'short' });
  return fmt.formatToParts(utcDate).find(p => p.type === 'timeZoneName')?.value || '';
}

function dayDelta(sourceDateStr, otherDateStr) {
  const a = new Date(sourceDateStr + 'T00:00:00Z');
  const b = new Date(otherDateStr + 'T00:00:00Z');
  return Math.round((b - a) / 86400000);
}

function todayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}
function nowTimeStr() {
  const t = new Date();
  return `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
}

function compute() {
  const sourceTz = TIMEZONES.find(t => t.id === state.sourceId);
  const utc = buildUtcFromTzInput(state.date, state.time, sourceTz.tz);
  const sourceFmt = formatInTz(utc, sourceTz.tz);
  const source = { ...sourceTz, ...sourceFmt, tzAbbr: getTzAbbr(utc, sourceTz.tz) };
  const others = TIMEZONES
    .filter(t => t.id !== state.sourceId)
    .map(t => {
      const f = formatInTz(utc, t.tz);
      return { ...t, ...f, tzAbbr: getTzAbbr(utc, t.tz), delta: dayDelta(sourceFmt.dateStr, f.dateStr) };
    });
  return { utc, source, others };
}

function buildVisualText(source, others) {
  const isNZ = source.id === 'nz';
  const sourceLine = isNZ
    ? `🇳🇿 **New Zealand** — ${source.time} (${source.tzAbbr})`
    : `**${source.flag} ${source.label}** — ${source.time} (${source.tzAbbr})`;
  const otherHeader = isNZ ? `**🇦🇺 Australian Times:**` : `**🕐 Other Time Zones:**`;
  return [
    `🕐 **Time Zone Converter**`, ``, sourceLine, ``, otherHeader,
    ...others.map(r => {
      const dayTag = r.delta !== 0 ? ` _(${r.delta > 0 ? '+' : ''}${r.delta}d)_` : '';
      return `> ${r.flag} **${r.label}** — ${r.time} (${r.tzAbbr})${dayTag}`;
    })
  ].join('\n');
}

function buildDynamicText(unix) {
  return [
    `🕐 **Clan Event**`, ``,
    `📅 <t:${unix}:F>`,
    `⏰ <t:${unix}:t> — your local time`,
    `⏳ <t:${unix}:R>`,
  ].join('\n');
}

function renderSourceSelector() {
  const el = document.getElementById('source-selector');
  el.innerHTML = TIMEZONES.map(t =>
    `<button class="source-btn ${state.sourceId === t.id ? 'active' : ''}" data-id="${t.id}">
      <span class="btn-flag">${t.flag}</span>${t.abbr}
    </button>`
  ).join('');
  el.querySelectorAll('.source-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.sourceId = btn.dataset.id;
      render();
    });
  });
}

function render() {
  document.querySelectorAll('.source-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.id === state.sourceId);
  });
  const { utc, source, others } = compute();
  document.getElementById('results').innerHTML = `
    <div class="result-row source-row">
      <div class="row-left">
        <span class="flag">${source.flag}</span>
        <div class="region-name">${source.label}<span class="source-tag">INPUT</span></div>
      </div>
      <div class="row-right">
        <span class="time-display">${source.time}</span>
        <span class="tz-abbr">${source.tzAbbr}</span>
      </div>
    </div>
  ` + others.map(r => `
    <div class="result-row">
      <div class="row-left">
        <span class="flag">${r.flag}</span>
        <span class="region-name">${r.label}${
          r.delta !== 0
            ? `<span class="day-badge ${r.delta < 0 ? 'minus' : ''}">${r.delta > 0 ? '+' : ''}${r.delta}d</span>`
            : ''
        }</span>
      </div>
      <div class="row-right">
        <span class="time-display">${r.time}</span>
        <span class="tz-abbr">${r.tzAbbr}</span>
      </div>
    </div>
  `).join('');

  const previewEl = document.getElementById('preview-box');
  const hintEl = document.getElementById('preview-hint');
  if (state.copyMode === 'visual') {
    previewEl.textContent = buildVisualText(source, others);
    hintEl.textContent = 'Static text — every viewer sees these exact times.';
  } else {
    const unix = Math.floor(utc.getTime() / 1000);
    previewEl.textContent = buildDynamicText(unix);
    hintEl.textContent = 'Dynamic — Discord auto-converts to each viewer\u2019s local time. Best for clan events.';
  }
}

function getCopyText() {
  const { utc, source, others } = compute();
  return state.copyMode === 'visual'
    ? buildVisualText(source, others)
    : buildDynamicText(Math.floor(utc.getTime() / 1000));
}

// Theme toggle
function setTheme(t) {
  if (t === 'light') document.documentElement.dataset.theme = 'light';
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('tb-theme', t); } catch(e) {}
  const meta = document.getElementById('themeColorMeta');
  if (meta) meta.setAttribute('content', t === 'light' ? '#f1f1f6' : '#0f0f14');
}
function currentTheme() {
  return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
}

function init() {
  state.date = todayStr();
  document.getElementById('date-input').value = state.date;
  document.getElementById('time-input').value = state.time;

  renderSourceSelector();
  render();

  document.getElementById('date-input').addEventListener('change', e => {
    state.date = e.target.value || todayStr(); render();
  });
  document.getElementById('time-input').addEventListener('change', e => {
    state.time = e.target.value || '20:00'; render();
  });
  document.getElementById('now-btn').addEventListener('click', () => {
    state.date = todayStr(); state.time = nowTimeStr();
    document.getElementById('date-input').value = state.date;
    document.getElementById('time-input').value = state.time;
    render();
  });

  document.querySelectorAll('.copy-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.copyMode = tab.dataset.mode === 'dynamic' ? 'dynamic' : 'visual';
      document.querySelectorAll('.copy-tab').forEach(t =>
        t.classList.toggle('active', t === tab)
      );
      render();
    });
  });

  document.getElementById('copy-btn').addEventListener('click', () => {
    const text = getCopyText();
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = '✓ Copied to Clipboard';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '⊞ Copy for Discord';
        btn.classList.remove('copied');
      }, 2000);
    });
  });

  // Theme toggle
  document.getElementById('themeToggle').addEventListener('click', () => {
    setTheme(currentTheme() === 'light' ? 'dark' : 'light');
  });
  // Sync meta theme-color on load
  setTheme(currentTheme());
}

init();
</script>
</body>
</html>
